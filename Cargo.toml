[package]
name = "herdr-npm"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "NPM scripts sidebar for Herdr"
license = "MIT"
repository = "https://github.com/massdo/herdr-npm"

[lib]
name = "herdr_npm"
path = "src/lib.rs"

[[bin]]
name = "herdr-npm"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
globset = "0.4"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
unicode-width = "0.2"
walkdir = "2.5"

[dev-dependencies]
cucumber = "0.23"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "features"
harness = false
path = "tests/features.rs"
