[package]
name = "herdr-npm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "NPM scripts sidebar for Herdr"
license = "MIT"

[lib]
name = "herdr_npm"
path = "src/lib.rs"

[[bin]]
name = "herdr-npm"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
