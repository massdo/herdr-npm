name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  recipe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: pnpm
        run: npm install -g pnpm@10.34.5
      - name: Install Herdr 0.9.1
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) target=linux-x86_64; sha=2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7 ;;
            Linux-aarch64) target=linux-aarch64; sha=f4ccf4de745f2cb9a39a983e9ba3703dad50ec2a58dea83026ceab721bbd8d9e ;;
            Darwin-x86_64) target=macos-x86_64; sha=053be0639935fe54ab5efbdb46651054e4f6a753a5b43153c88bd6912bce1e94 ;;
            Darwin-arm64) target=macos-aarch64; sha=5fc7a7e7adfaca56fa80aa89dcb025693357268dab8285b9ce2d08a2313c89de ;;
            *) echo "Unsupported runner" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 "https://github.com/herdrdev/herdr/releases/download/v0.9.1/herdr-$target" -o "$RUNNER_TEMP/herdr"
          echo "$sha  $RUNNER_TEMP/herdr" | shasum -a 256 -c -
          install -m 755 "$RUNNER_TEMP/herdr" "$HOME/.local/bin/herdr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: versions
        run: |
          rustc --version
          cargo --version
          herdr --version
          npm --version
          pnpm --version
      - name: e2e recipe
        env:
          HERDR_SIDEBAR_ROOT: ""
        run: sh scripts/e2e.sh
      - name: V1.1 e2e recipe
        env:
          HERDR_SIDEBAR_ROOT: ""
          HERDR_NPM_E2E_CASE: v1_1
        run: sh scripts/e2e.sh
      - name: install from this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          sh scripts/install-smoke.sh "${{ github.sha }}"
