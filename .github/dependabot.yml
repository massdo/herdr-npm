version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Pinned to Rust 1.89 like rust-toolchain.toml; a newer Rust is a deliberate change.
      - dependency-name: dtolnay/rust-toolchain
